<style>
/* ---- Styles of the portal screens, as on the Design canvas ---- */
body{margin:0;background:#f2f2f2}
a{color:#1a1a1a}a:hover{color:#3a3a3a}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #9a212f;outline-offset:2px}
.ink:hover{background:#3a3a3a !important;border-color:#3a3a3a !important}
.outline:hover,.row:hover,.tab:hover{background:#e5e5e5 !important}
a:focus-visible,button:focus-visible{outline:2px solid #9a212f;outline-offset:2px}
.kcard:hover,.more:hover{background:#e5e5e5 !important}
.outline:hover,.row:hover{background:#e5e5e5 !important}
@keyframes sk-pulse{0%,100%{opacity:1}50%{opacity:.45}}
.sk{animation:sk-pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.outline:hover{background:#e5e5e5 !important}
a:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid #9a212f;outline-offset:2px}
body{margin:0}

/* ---- The prototype's frame, after the phase 1 shared prototype ---- */
html,body{height:100%}
body{margin:0;background:#f0eee9;overflow:hidden;font-family:'Inter Variable',Inter,system-ui,sans-serif;color:#1a1a1a}
.ps-app{display:flex;width:100%;height:100%}
.ps-nav{width:360px;flex:none;height:100%;overflow-y:auto;display:flex;flex-direction:column;box-sizing:border-box;background:#f0eee9;border-right:1.5px solid #1a1a1a;font-size:16px;line-height:1.5}
.ps-nav button{font:inherit;color:inherit;cursor:pointer}
.ps-nav :focus-visible{outline:3px solid rgba(166,25,46,.45);outline-offset:2px}
.ps-head{display:flex;align-items:center;gap:12px;padding:16px 20px 12px}
.ps-head img{width:28px;height:28px;flex:none}
.ps-head-t{font-size:16px;font-weight:600;line-height:1.25}
.ps-head-s{font-size:13px;color:#555;line-height:1.3}
.ps-opts{padding:0 16px 16px}
.ps-opts h2{margin:0;padding:0 4px 8px;font-size:14px;font-weight:600}
.ps-opt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ps-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:0 4px;text-align:center;background:#fff;border:1.5px solid #1a1a1a;border-radius:8px;box-shadow:3px 3px 0 rgba(0,0,0,.18)}
.ps-opt svg{width:24px;height:24px}
.ps-opt b{font-size:15px;line-height:1.2}
.ps-opt span{font-size:12px;line-height:1.2;color:#555}
.ps-opt[aria-pressed="true"]{background:#1a1a1a;color:#fff}
.ps-opt[aria-pressed="true"] span{color:rgba(255,255,255,.85)}
.ps-desc{display:flex;flex-direction:column;gap:12px;padding:16px 20px;background:#fff;border-top:1.5px solid #1a1a1a;border-bottom:1.5px solid #1a1a1a}
.ps-desc-h{display:flex;align-items:baseline;gap:8px}
.ps-desc-h h2{margin:0;font-size:18px;font-weight:600;line-height:1.4}
.ps-badge{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;box-sizing:border-box;border-radius:4px;font-size:13px;font-weight:600;line-height:1}
.ps-desc .ps-badge{background:#1a1a1a;color:#fff;font-size:14px;align-self:center}
.ps-desc p{margin:0;font-size:15px;line-height:1.625}
.ps-access{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1.5px solid #1a1a1a;border-radius:8px;background:#fff}
.ps-access svg{width:20px;height:20px;flex:none;margin-top:2px}
.ps-access b{display:block;font-size:17px;line-height:1.35}
.ps-access div div{margin-top:4px;font-size:14px;line-height:1.375;color:#333}
.ps-seg-l{font-size:14px;font-weight:600}
.ps-seg{display:inline-flex;align-self:flex-start;padding:3px;gap:2px;border:1.5px solid #1a1a1a;border-radius:8px;background:#fff}
.ps-seg button{min-height:36px;padding:4px 12px;border:0;border-radius:6px;background:transparent;font-size:15px}
.ps-seg button[aria-pressed="true"]{background:#1a1a1a;color:#fff}
.ps-list{display:flex;flex-direction:column;gap:4px;padding:16px 12px}
.ps-list+.ps-list{border-top:1.5px solid #1a1a1a}
.ps-list h2{margin:0;padding:8px 8px 4px;font-size:13px;font-weight:600;letter-spacing:.025em;text-transform:uppercase;color:#555}
.ps-list h2:first-child{padding-top:0}
.ps-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 8px;border:0;border-radius:6px;background:transparent;text-align:left;font-size:15px;line-height:1.5}
.ps-item:hover{background:#fff}
.ps-item .ps-badge{border:1.5px solid #1a1a1a;background:#fff}
.ps-item>span.ps-t{flex:1;min-width:0}
.ps-item svg{width:18px;height:18px;flex:none}
.ps-tag{flex:none;padding:0 6px;border:1.5px dashed #1a1a1a;border-radius:5px;font-size:12px;line-height:18px}
.ps-item[aria-current="true"]{background:#1a1a1a;color:#fff}
.ps-item[aria-current="true"] .ps-badge{border-color:#fff;background:transparent}
.ps-item[aria-current="true"] .ps-tag{border-color:#fff}
.ps-foot{margin-top:auto;display:flex;gap:8px;padding:12px 16px;border-top:1.5px solid #1a1a1a;position:sticky;bottom:0;background:#f0eee9}
.ps-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 10px;border:1px solid #1a1a1a;border-radius:6px;background:#fff;font-size:14px;font-weight:500}
.ps-btn:hover{background:#1a1a1a;color:#fff}
.ps-btn svg{width:16px;height:16px;flex:none}
.ps-btn[aria-pressed="true"]{background:#1a1a1a;color:#fff}
.ps-tour{position:sticky;top:8px;z-index:10;margin:8px 16px 16px;display:flex;flex-direction:column;gap:12px;padding:16px;background:#fff;border:1px solid #1a1a1a;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ps-tour-k{font-size:13px;color:#555}
.ps-tour-t{font-size:16px;font-weight:600}
.ps-prog{height:8px;box-sizing:border-box;border:1.5px solid #1a1a1a;border-radius:999px;background:#fff;overflow:hidden}
.ps-prog div{height:100%;background:#1a1a1a;border-radius:999px;transition:width .3s}
.ps-tour-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ps-tour-g .ps-btn{font-size:15px}
.ps-tour-x{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:0;background:transparent;font-size:15px;font-weight:500}
.ps-tour-x svg{width:16px;height:16px}

.ps-stage{position:relative;flex:1;min-width:0;height:100%;overflow:hidden;background:#dcd8cf}
.ps-scene{position:absolute;top:0;left:0;width:1960px;height:1218px;transform-origin:0 0;transition:transform .35s cubic-bezier(.4,0,.2,1)}
.ps-bezel{position:absolute;left:0;right:0;top:0;height:1130px;padding:26px;box-sizing:border-box;background:#1f1f1f;border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.ps-screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:4px;background:linear-gradient(160deg,#c9d2cf 0%,#b8c2c0 55%,#a9b3b3 100%)}
.ps-neck{position:absolute;left:890px;top:1130px;width:180px;height:70px;background:#2a2a2a}
.ps-base{position:absolute;left:700px;top:1200px;width:560px;height:18px;background:#2a2a2a;border-radius:4px 4px 0 0}
.ps-callout{position:absolute;left:36px;top:40px;width:510px;display:flex;align-items:flex-start;gap:12px;box-sizing:border-box;padding:20px 24px;background:#fff;color:#1a1a1a;border:1.5px solid #1a1a1a;border-radius:8px;box-shadow:4px 4px 0 rgba(0,0,0,.2)}
.ps-callout svg{width:36px;height:36px;flex:none;margin-top:4px}
.ps-callout-k{font-size:22px;font-weight:500;color:#555;line-height:1.3}
.ps-callout-t{font-size:38px;font-weight:700;line-height:1.2}
.ps-callout-x{margin-top:6px;font-size:22px;line-height:1.375;color:#333}
.ps-window{position:absolute;top:0;right:0;width:1330px;bottom:44px;display:flex;flex-direction:column;background:#f2f2f2;border-left:1.5px solid #1a1a1a;box-shadow:-6px 0 18px rgba(0,0,0,.18)}
.ps-titlebar{flex:none;display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 4px 0 12px;background:#e6e3dc;border-bottom:1px solid #bdbab3;font-size:13px;color:#333}
.ps-titlebar span:first-child{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-ctl{display:flex;gap:2px}
.ps-ctl span{display:flex;align-items:center;justify-content:center;width:36px;height:28px}
.ps-winbody{position:relative;flex:1;min-height:0;overflow:auto;background:#f2f2f2}
.ps-fixed{padding:24px;box-sizing:border-box;background:#e6e3dc;min-height:100%}
.ps-fixed>div{margin:0 auto}
.ps-taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;background:rgba(43,46,48,.9)}
.ps-taskbar span{width:24px;height:24px;border-radius:5px;background:#55595b}
.ps-taskbar span:first-child{background:#6b7072}
.ps-taskbar span:last-child{width:64px;height:8px;border-radius:4px;margin-left:auto}
.ps-ring{position:absolute;z-index:20;pointer-events:none;box-sizing:border-box;border:3px solid #1a1a1a;border-radius:8px;box-shadow:0 0 0 3px #fff,0 0 0 9999px rgba(20,20,20,.22);transition:all .25s}
.ps-tip{position:absolute;z-index:21;width:340px;box-sizing:border-box;padding:16px;background:#fff;color:#1a1a1a;border:1.5px solid #1a1a1a;border-radius:8px;box-shadow:4px 4px 0 rgba(0,0,0,.18);font-size:16px;line-height:1.375}
.ps-tip-k{margin-bottom:6px;font-size:13px;font-weight:500;color:#555}
.ps-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.ps-scene,.ps-ring,.ps-prog div{transition:none}}
@media (max-width: 900px){
  body{overflow:auto}
  .ps-app{flex-direction:column;height:auto}
  .ps-nav{width:100%;height:auto;max-height:none;border-right:0;border-bottom:1.5px solid #1a1a1a}
  .ps-foot{position:static}
  .ps-stage{flex:none;height:75vh}
}
</style>
</head>

      box.appendChild(inner);
      wrap.appendChild(box);
    } else {
      wrap.appendChild(frag);
    }
    host.replaceChildren(wrap);
    fixLinks(host);
    host.scrollTop = keep;
    if (fi >= 0) { var f = focusables()[fi]; if (f) f.focus(); }
  }

  // ---------- the navigator ----------
  var listed = META.filter(function (s) { return !s.hidden; });
  function navId(id) { return id === 'Lista-Quadro' ? 'Main' : id; }
  (function buildList() {
    var root = document.getElementById('ps-screens');
    var nav = document.createElement('nav');
    nav.className = 'ps-list';
    nav.setAttribute('aria-label', 'Ecrãs do serviço');
    var last = null, html = '';
    listed.forEach(function (s) {
      if (s.group !== last) { html += '<h2>' + esc(s.group) + '</h2>'; last = s.group; }
      html += '<button type="button" class="ps-item" data-ecra="' + s.id + '"><span class="ps-badge">' + s.n + '</span><span class="ps-t">' + esc(s.name) + '</span>' + (s.tag ? '<span class="ps-tag">' + esc(s.tag) + '</span>' : '') + '</button>';
    });
    nav.innerHTML = html;
    root.appendChild(nav);
    nav.addEventListener('click', function (e) {
      var b = e.target.closest('.ps-item');
      if (!b) return;
      stopTour();
      go(listTarget(b.getAttribute('data-ecra')));
    });
  })();

  function renderDesc(s, props) {
    var d = document.getElementById('ps-desc');
    var html = '<div class="ps-desc-h"><span class="ps-badge">' + s.n + '</span><h2 id="ps-desc-h">' + esc(s.name) + '</h2></div>';
    html += '<p>' + esc(s.desc) + '</p>';
    Object.keys(s.enums || {}).forEach(function (key) {
      html += '<div class="ps-seg-l" id="ps-seg-' + key + '">Estado final</div><div class="ps-seg" role="group" aria-labelledby="ps-seg-' + key + '">';
      s.enums[key].forEach(function (v) {
        html += '<button type="button" data-k="' + esc(key) + '" data-v="' + esc(v) + '" aria-pressed="' + (props[key] === v ? 'true' : 'false') + '">' + esc(v) + '</button>';
      });
      html += '</div>';
    });
    html += '<div class="ps-access">' + svg(s.icon) + '<div><b><span class="ps-sr">Acesso: </span>' + esc(s.access.title) + '</b><div>' + esc(s.access.text) + '</div></div></div>';
    d.innerHTML = html;
    var segs = d.querySelectorAll('.ps-seg button');
    for (var i = 0; i < segs.length; i++) segs[i].addEventListener('click', function () {
      stopTour();
      go(s.id, this.getAttribute('data-k') + '=' + encodeURIComponent(this.getAttribute('data-v')));
    });
    var items = document.querySelectorAll('.ps-item[data-ecra]');
    for (var j = 0; j < items.length; j++) items[j].setAttribute('aria-current', items[j].getAttribute('data-ecra') === navId(s.id) ? 'true' : 'false');
  }
  function renderCallout(s) {
    document.getElementById('ps-callout').innerHTML = svg(s.icon) + '<div style="min-width:0"><div class="ps-callout-k">Ecrã ' + s.n + ' · ' + esc(s.name) + '</div><div class="ps-callout-t">' + esc(s.access.title) + '</div><div class="ps-callout-x">' + esc(s.access.text) + '</div></div>';
    document.getElementById('ps-wintitle').textContent = s.window;
  }

  var opts = document.querySelectorAll('.ps-opt');
  for (var oi = 0; oi < opts.length; oi++) opts[oi].addEventListener('click', function () {
    stopTour();
    setOpcao(this.getAttribute('data-opcao'));
    go(OPT_SCREEN[opcao]);
  });

  // ---------- the monitor: whole, or the portal up close ----------
  var stage = document.getElementById('ps-stage'), scene = document.getElementById('ps-scene');
  var perto = false, scale = 1;
  var SCENE_W = 1960, SCENE_H = 1218, WIN_X = 26 + 1908 - 1330, WIN_Y = 26, WIN_W = 1330;
  function layout() {
    var W = stage.clientWidth, H = stage.clientHeight, tx, ty;
    if (!perto) {
      scale = Math.min((W - 48) / SCENE_W, (H - 48) / SCENE_H);
      tx = (W - SCENE_W * scale) / 2; ty = (H - SCENE_H * scale) / 2;
    } else {
      scale = (W - 32) / WIN_W;
      tx = 16 - WIN_X * scale; ty = 16 - WIN_Y * scale;
    }
    scene.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }
  var pertoBtn = document.getElementById('ps-perto');
  function renderPerto() {
    pertoBtn.setAttribute('aria-pressed', perto ? 'true' : 'false');
    pertoBtn.innerHTML = perto ? svg('zoomout') + 'Monitor inteiro' : svg('zoomin') + 'Portal de perto';
  }
  pertoBtn.addEventListener('click', function () { perto = !perto; renderPerto(); layout(); afterMove(); });
  window.addEventListener('resize', function () { layout(); if (current && current.s.fixed) paint(current.s, current.inst); afterMove(); });

  // ---------- journeys (from 02-jornadas, J-S1 to J-S5) ----------
  var JOURNEYS = [
    { id: 'J-S1', title: 'O serviço recebe um pedido novo', steps: [
      { s: 'Email-alerta', sel: 'h1', t: 'O atendedor fecha um assunto «Direcionado» no Espaço. Segue um alerta para a lista de distribuição do serviço.' },
      { s: 'Email-alerta', sel: 'a', has: 'Abrir o pedido', t: 'O alerta leva a referência e uma ligação. Sem dados pessoais e sem anexos.' },
      { s: 'LIST', sel: 'button.tab', has: 'Novo', selB: 'section[aria-label^="Novo"]', t: 'A lista do serviço abre nos pedidos «Novo», com a idade de cada um. O pedido aparece aqui mesmo que o alerta se perca.' },
      { s: 'LIST', sel: 'a.row', has: 'ENC-2026-000184', selB: 'a.kcard', hasB: 'ENC-2026-000184', t: 'Um clique abre o pedido.' },
      { s: 'Detalhe-Novo', sel: 'h1', t: 'Abrir o pedido não muda o estado: continua «Novo». Não há «Recebido».' },
      { s: 'Detalhe-Novo', sel: 'section', has: 'Classificação', t: 'A classificação e o resumo do atendedor. As palavras do cidadão não aparecem.' },
      { s: 'Detalhe-Novo', sel: 'section', has: 'Cidadão atendido', t: 'As pessoas, com os dados que o perfil de dados do destino permite.' },
      { s: 'Detalhe-Novo', sel: 'section', has: 'Documentos', t: 'Os documentos descarregam-se aqui, no portal. Nunca seguem no email.' },
      { s: 'Pedido-indisponivel', sel: 'main section', t: 'Uma ligação para um pedido de outro destino não abre, e o portal não diz se o pedido existe.' }
    ] },
    { id: 'J-S2', title: 'O serviço começa a tratar do pedido', steps: [
      { s: 'Detalhe-Novo', sel: 'aside a', has: 'Passar a Em curso', t: 'No pedido aberto, a pessoa escolhe «Passar a Em curso».' },
      { s: 'Dialogos-notas', sel: '#n1', t: 'Escreve uma nota curta para o Espaço: o que vai ser feito. A nota é obrigatória.' },
      { s: 'Dialogos-notas', sel: 'a.ink', has: 'Passar a Em curso', t: 'Confirma.' },
      { s: 'Detalhe-EmCurso', sel: 'ol li', t: 'O pedido passa a «Em curso», com a data, a nota e quem a escreveu. O Espaço vê o estado e a nota.' }
    ] },
    { id: 'J-S3', title: 'O serviço precisa de informação', steps: [
      { s: 'Detalhe-EmCurso', sel: 'aside a', has: 'Aguarda informação', t: 'Num pedido «Em curso», a pessoa escolhe «Aguarda informação».' },
      { s: 'Dialogos-notas', sel: '#n2', t: 'Escreve na nota o que falta. Nesta fase não há conversa no portal: o que falta diz-se aqui.' },
      { s: 'LIST', click: { sel: 'button.tab', has: 'Aguarda' }, sel: 'a.row', selB: 'section[aria-label^="Aguarda"]', t: 'A lista mostra-o à parte, em «Aguarda informação».' },
      { s: 'Detalhe-Aguarda', sel: 'aside a', has: 'Retomar', t: 'Quando a informação chega, «Retomar» volta a «Em curso», com uma nota.' }
    ] },
    { id: 'J-S4', title: 'O serviço conclui, e o cidadão volta ao Espaço', steps: [
      { s: 'Detalhe-EmCurso', sel: 'aside a', has: 'Concluir', t: 'Num pedido «Em curso» ou «Aguarda informação», a pessoa escolhe «Concluir».' },
      { s: 'Dialogo-Concluir-erro', sel: '#nota-erro', t: 'Sem nota, o pedido não conclui: o portal diz o que falta.' },
      { s: 'Dialogo-Concluir-preenchido', sel: 'textarea', t: 'A nota diz o que foi feito, para o Espaço ler.' },
      { s: 'Detalhe-Concluido', q: 'estadoFinal=Conclu%C3%ADdo', sel: 'aside section', t: 'O pedido fica «Concluído» e fecha neste serviço.' },
      { s: 'Detalhe-Concluido', q: 'estadoFinal=Conclu%C3%ADdo', sel: 'ol li', t: 'Mais tarde, no Espaço, o atendedor vê no ecrã 10 o estado e esta nota, e diz ao cidadão o que o serviço escreveu. O resultado do assunto continua «Direcionado».' }
    ] },
    { id: 'J-S5', title: 'O serviço devolve o pedido', steps: [
      { s: 'Detalhe-EmCurso', sel: 'aside a', has: 'Devolver', t: 'Num pedido aberto, a pessoa escolhe «Devolver».' },
      { s: 'Devolver-outro-servico', sel: '#srv-lista', t: 'Para outro serviço: só aparecem os destinos que já usam o portal. Lá, o pedido entra como «Novo», com a mesma referência e o histórico.' },
      { s: 'Devolver-ao-Espaco', sel: 'fieldset', t: 'Ou de volta ao Espaço Santa Casa: o coordenador vê-o na sua vista.' },
      { s: 'Devolver-ao-Espaco', sel: 'textarea', t: 'A razão da devolução é obrigatória.' },
      { s: 'Devolver-erros', sel: '#srv-erro', t: 'Sem escolher o serviço ou sem razão, o pedido não é devolvido.' },
      { s: 'Detalhe-Concluido', q: 'estadoFinal=Devolvido', sel: 'aside section', t: 'O pedido fica «Devolvido» e fecha neste serviço.' }
    ] }
  ];
  (function buildTours() {
    var nav = document.getElementById('ps-tours');
    var html = '<h2 id="ps-tours-h">Jornadas do serviço</h2>';
    JOURNEYS.forEach(function (j, i) {
      html += '<button type="button" class="ps-item" data-jornada="' + i + '">' + svg('play') + '<span class="ps-t">' + esc(j.title) + '</span></button>';
    });
    nav.innerHTML = html;
    nav.addEventListener('click', function (e) {
      var b = e.target.closest('.ps-item');
      if (b) startTour(Number(b.getAttribute('data-jornada')));
    });
  })();

  var tour = null, expectHash = null;
  var ring = document.getElementById('ps-ring'), tip = document.getElementById('ps-tip');
  function stepScreen(st) { return st.s === 'LIST' ? OPT_SCREEN[opcao] : st.s; }
  function findIn(sel, has) {
    var c = host.querySelectorAll(sel);
    for (var i = 0; i < c.length; i++) if (!has || c[i].textContent.indexOf(has) >= 0) return c[i];
    return null;
  }
  function startTour(i) {
    tour = { i: i, step: 0, playing: true, speed: 1, timer: null };
    renderTour();
    showStep();
  }
  function stopTour() {
    if (!tour) return;
    clearTimeout(tour.timer);
    tour = null;
    ring.hidden = true; tip.hidden = true;
    renderTour();
  }
  function renderTour() {
    var p = document.getElementById('ps-tourpanel');
    var items = document.querySelectorAll('.ps-item[data-jornada]');
    for (var k = 0; k < items.length; k++) items[k].setAttribute('aria-current', tour && Number(items[k].getAttribute('data-jornada')) === tour.i ? 'true' : 'false');
    if (!tour) { p.innerHTML = ''; return; }
    var j = JOURNEYS[tour.i], n = j.steps.length, done = tour.step >= n - 1 && !tour.playing;
    p.innerHTML = '<div class="ps-tour" aria-label="Jornada em curso"><div><div class="ps-tour-k">' + (done ? 'Jornada terminada' : 'Jornada a decorrer') + ' · passo ' + (tour.step + 1) + ' de ' + n + '</div><div class="ps-tour-t">' + esc(j.title) + '</div></div>' +
      '<div class="ps-prog" aria-hidden="true"><div style="width:' + ((tour.step + 1) / n * 100) + '%"></div></div>' +
      '<div class="ps-tour-g">' +
      '<button type="button" class="ps-btn" data-a="play">' + (tour.playing ? svg('pause') + 'Pausa' : svg('play') + 'Continuar') + '</button>' +
      '<button type="button" class="ps-btn" data-a="next"' + (tour.step >= n - 1 ? ' disabled' : '') + '>' + svg('next') + 'Seguinte</button>' +
      '<button type="button" class="ps-btn" data-a="again">' + svg('again') + 'Recomeçar</button>' +
      '<button type="button" class="ps-btn" data-a="speed" aria-pressed="' + (tour.speed === 2 ? 'true' : 'false') + '">' + svg('fast') + (tour.speed === 2 ? '1x' : '2x') + '</button>' +
      '</div><button type="button" class="ps-tour-x" data-a="exit">' + svg('x') + 'Sair da jornada</button></div>';
    p.querySelector('.ps-tour').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-a]');
      if (!b || !tour) return;
      var a = b.getAttribute('data-a');
      if (a === 'exit') { stopTour(); return; }
      if (a === 'again') { tour.step = 0; tour.playing = true; showStep(); }
      else if (a === 'next') { if (tour.step < JOURNEYS[tour.i].steps.length - 1) { tour.step++; showStep(); } }
      else if (a === 'play') {
        if (!tour.playing && tour.step >= JOURNEYS[tour.i].steps.length - 1) tour.step = 0;
        tour.playing = !tour.playing; if (tour.playing) showStep(); else clearTimeout(tour.timer);
      }
      else if (a === 'speed') { tour.speed = tour.speed === 2 ? 1 : 2; if (tour.playing) schedule(); }
      renderTour();
    });
  }
  function schedule() {
    clearTimeout(tour.timer);
    var j = JOURNEYS[tour.i], st = j.steps[tour.step];
    if (!tour.playing) return;
    if (tour.step >= j.steps.length - 1) { tour.playing = false; renderTour(); return; }
    var ms = Math.max(4500, st.t.length * 55) / tour.speed;
    tour.timer = setTimeout(function () { if (!tour) return; tour.step++; showStep(); }, ms);
  }
  function showStep() {
    var j = JOURNEYS[tour.i], st = j.steps[tour.step];
    var hash = '#/ecra/' + stepScreen(st) + (st.q ? '?' + st.q : '');
    tour.clicked = -1;
    renderTour();
    if (location.hash !== hash) { expectHash = hash; location.hash = hash; }
    else { route(); }
  }
  function afterMove() { if (tour) placeTour(false); }
  function placeTour(scroll) {
    var j = JOURNEYS[tour.i], st = j.steps[tour.step];
    var useB = st.s === 'LIST' && opcao === 'B';
    if (st.click && !useB && tour.clicked !== tour.step) { var c = findIn(st.click.sel, st.click.has); if (c) { tour.clicked = tour.step; c.click(); return; } }
    var el = findIn(useB ? (st.selB || st.sel) : st.sel, useB ? (st.hasB || null) : st.has);
    var sr = stage.getBoundingClientRect();
    if (el && scroll) {
      var hb = host.getBoundingClientRect(), r0 = el.getBoundingClientRect();
      var offset = (r0.top - hb.top) / scale + host.scrollTop;
      var target = offset - (host.clientHeight - r0.height / scale) / 2;
      host.scrollTop = Math.max(0, target);
    }
    tip.innerHTML = '<div class="ps-tip-k">' + esc(j.title) + ' · passo ' + (tour.step + 1) + ' de ' + j.steps.length + '</div>' + esc(st.t);
    tip.hidden = false;
    var tw = 340, th = tip.offsetHeight, x, y;
    if (el) {
      var r = el.getBoundingClientRect();
      var L = Math.max(r.left, sr.left) - sr.left - 6, T = Math.max(r.top, sr.top) - sr.top - 6;
      var R = Math.min(r.right, sr.right) - sr.left + 6, B = Math.min(r.bottom, sr.bottom) - sr.top + 6;
      ring.style.left = L + 'px'; ring.style.top = T + 'px';
      ring.style.width = Math.max(12, R - L) + 'px'; ring.style.height = Math.max(12, B - T) + 'px';
      ring.hidden = false;
      x = Math.min(Math.max(12, L), sr.width - tw - 12);
      y = B + 12;
      if (y + th > sr.height - 12) y = T - th - 12;
      if (y < 12) { y = Math.min(Math.max(12, T), sr.height - th - 12); x = L - tw - 16; if (x < 12) x = Math.min(R + 16, sr.width - tw - 12); }
    } else {
      ring.hidden = true;
      x = 24; y = 24;
    }
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  host.addEventListener('scroll', function () { if (tour) placeTour(false); });

  // ---------- routing ----------
  function go(id, q) { location.hash = '#/ecra/' + id + (q ? '?' + q : ''); }
  function route() {
    var r = parseHash();
    var s = BY_ID[r.id];
    var fromTour = expectHash !== null && location.hash === expectHash;
    expectHash = null;
    if (tour && !fromTour && !(location.hash === '#/ecra/' + stepScreen(JOURNEYS[tour.i].steps[tour.step]) + (JOURNEYS[tour.i].steps[tour.step].q ? '?' + JOURNEYS[tour.i].steps[tour.step].q : ''))) stopTour();
    if (!s) { go(OPT_SCREEN[opcao]); return; }
    if (s.id === 'Main') setOpcao('A');
    if (s.id === 'Lista-Quadro') setOpcao('B');
    var props = Object.assign({}, s.defaults, r.params);
    var inst = new SCREENS[s.id](props);
    current = { s: s, inst: inst };
    inst.__rerender = function () { paint(s, inst); if (tour) placeTour(false); };
    document.title = s.docTitle + ' · protótipo';
    renderDesc(s, props);
    renderCallout(s);
    host.scrollTop = 0;
    paint(s, inst);
    if (tour) {
      requestAnimationFrame(function () { requestAnimationFrame(function () { if (!tour) return; placeTour(true); schedule(); }); });
    }
  }

  document.getElementById('ps-repor').addEventListener('click', function () {
    stopTour();
    perto = false; renderPerto(); layout();
    setOpcao('A');
    try { window.localStorage.removeItem('ps-opcao'); } catch (e) {}
    var h = '#/ecra/' + OPT_SCREEN.A;
    if (location.hash === h) route(); else location.hash = h;
  });

  setOpcao(opcao);
  renderPerto();
  layout();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
