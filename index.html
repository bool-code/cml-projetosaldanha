 antes de enviar.`},{alvo:`rascunho-enviar`,acao:`clicar`},{alvo:`rascunho-enviado`,texto:`Segue para a caixa da coordenação, que o faz chegar a quem mantém a informação.`},{alvo:`rascunho-continuar`,acao:`clicar`},{alvo:`aviso-dados-prestado`,texto:`Fechado, com o resultado de cada assunto e a hora a que a informação sobre dados foi prestada.`}]},{id:`J2`,titulo:`Atendimento sem marcação`,vista:`atendedor`,passos:[{ecra:`EC-01`,papel:`atendedor`,alvo:`nova-senha`,texto:`O cidadão tira uma senha no tótem e chega ao balcão. O atendedor introduz o número.`,acao:`clicar`},{alvo:`numero-senha`,acao:`escrever`,valor:`A051`},{alvo:`tipologia-TIP-GERAL`,texto:`A tipologia da senha diz que veio sem marcação.`},{alvo:`adicionar-senha`,acao:`clicar`},{alvo:`senha-A051`,texto:`A linha entrou na agenda. Um clique abre o atendimento.`,acao:`clicar`},{alvo:`ditar-0`,texto:`Em estudo: em vez de escrever, o atendedor pode ditar o que o cidadão veio procurar. Toca em «Ditar».`,acao:`clicar`},{alvo:`gravacao-0`,texto:`O portal mostra que está a gravar. O atendedor fala, ou repete o que o cidadão disse.`},{alvo:`parar-ditar-0`,texto:`Toca em «Parar».`,acao:`clicar`},{alvo:`transcricao-0`,texto:`O texto aparece no campo, para rever e corrigir. A transcrição em português europeu varia com quem fala, por isso a revisão é do atendedor.`},{alvo:`motivo-0`,texto:`Classificado.`,acao:`combo`,valor:`museu`,opcao:`M-CU-02-01`},{alvo:`passar-fecho`,acao:`clicar`},{alvo:`res-0-resolvido-total`,texto:`Ficou resolvido na totalidade.`,acao:`clicar`},{alvo:`pergunta-identificado`,texto:`Não há ficha associada, por isso o portal pergunta se o cidadão ficou identificado. A resposta é obrigatória.`},{alvo:`identificado-nao`,texto:`Uma pergunta curta não precisa de identificação.`,acao:`clicar`},{alvo:`fechar-atendimento`,acao:`clicar`},{alvo:`info-0-disponivel`,texto:`A informação estava disponível.`,acao:`clicar`},{alvo:`concluir`,acao:`clicar`},{alvo:`fechado-agenda`,acao:`clicar`},{alvo:`senha-A051` scolhe; o resto preenche-se sozinho. O botão «Ditar», em estudo, mostra onde entraria a transcrição da voz.`,aberto:[`Se a transcrição da voz serve, com que fiabilidade em português europeu, e com que microfones.`],papeis:[`atendedor`],acesso:g_},{id:`EC-04`,numero:4,titulo:`O atendimento, fecho`,frase:`O segundo passo, sempre pela mesma ordem: o resultado de cada assunto e, quando passa a uma área, o ${$.seguimento}. Depois de fechar, o estado da informação de cada assunto.`,papeis:[`atendedor`],acesso:g_,aberto:[`Com que critério se distingue resolvido na totalidade de resolvido parcialmente, por serviço.`,`Se o não resolvido leva um motivo, e para quem seguem os atendimentos não resolvidos ou pendentes.`,`Se o portal pode deduzir que o cidadão ficou identificado, em vez de o perguntar.`,`Se o coordenador recebe um email por caso ou um resumo de vários.`]},{id:`EC-05`,numero:5,titulo:`Novo cidadão`,frase:`Criar a ficha de um cidadão: o nome e pelo menos um identificador, o NIF quando exista, o NISS ou o número de um documento. Sem nenhum, o atendimento continua sem identificar. Os contactos e o resto são opcionais.`,papeis:[`atendedor`],acesso:g_},{id:`EC-06`,numero:6,titulo:`Identificar o cidadão`,frase:`O painel abre por cima do atendimento, a qualquer momento, e fecha sem ser preciso completá-lo. Antes de qualquer dado, o atendedor lê ao cidadão a informação sobre o tratamento de dados e confirma. Procura-se por um número, pelo telemóvel ou pelo email, nunca pelo nome.`,papeis:[`atendedor`],acesso:g_},{id:`EC-07`,numero:7,titulo:`Quem está ao balcão e para quem é o pedido`,frase:`Fora desta versão, a reavaliar antes da entrada em produção. Até lá, quem atende regista no texto livre do assunto quem compareceu, a quem respeita o pedido e quem deve receber a resposta. Registar uma terceira pessoa levanta questões legais e de proteção de dados sobre ver dados sensíveis de quem não está presente, e os limites aceitáveis são da Santa Casa definir.`,papeis:[`atendedor`],acesso:g_,fora:!0,aberto:[`Que limites a Santa Casa aceita para o caso de alguém que pede em nome de outra pessoa.`]},{id:`EC-09`,numero:9,titulo:`O painel`,frase:`Os números do Espaço, cada um com a sua unidade: atendimentos ou assuntos. Os tempos separam o atendimento, o pós-atendimento e o ciclo total, também por atendedor. A extração com dados identificados é só do coordenador e da direção.`,papeis:[`coordenador`,`direcao`],acesso:__(),quem:`As lacunas filtram-se por ${Qg.minusculo}.`},{id:`EC-10`,numero:10,titulo:`O cidadão que volta`,frase:`Quando o cidadão já é conhecido: as visitas anteriores, primeiro as que têm seguimento pendente, depois pela data do último estado, com o resultado e o seguimento de cada assunto. Serve para ver o que foi tratado; nada passa para o atendimento de hoje.`,papeis:[`atendedor`],acesso:g_},{id:`EC-11`,numero:11,titulo:`A entrada da senha`,frase:`O atendedor escreve a senha como está impressa, uma letra e três algarismos, e escolhe a tipologia. A senha é um dado do registo, não a sua chave: cada linha tem a sua referência, e a mesma senha pode voltar a entrar.`,papeis:[`atendedor`],acesso:g_},{id:`EC-12`,numero:12,titulo:`O email do ${$.pedido}`,frase:`Não é um ecrã do portal: é a mensagem como a área de destino a recebe, na caixa de correio que já usa. Responder pelo próprio email fica para a fase 3.`,papeis:[`destino`],acesso:{nivel:`fora`,rotulo:`Fora do portal`,detalhe:`Quem recebe o pedido na área de destino, na sua caixa de correio, sem conta no portal.`}},{id:`EC-13`,numero:13,titulo:`O inquérito ao cidadão`,frase:`Fora do portal e fora da versão 1, por decisão da Santa Casa: faz-se à saída, num tablet autónomo. Fica desenhado e desativado, como o ecrã 7.`,papeis:[`cidadao`],acesso:{nivel:`cidadao`,rotulo:`Virado para o cidadão`,detalhe:`Fora do portal e fora da versão 1: um tablet autónomo à saída, sem ligação ao portal.`},fora:!0},{id:`EC-14`,numero:14,titulo:`O back-office das listas`,frase:`Onde se mantêm as listas, um valor de cada vez, na própria página. Cada valor tem uma chave que não muda e um nome que pode mudar. Não há carregamento de ficheiros.`,papeis:[`coordenador`,`direcao`,`digisti`],acesso:{nivel:`coordenacao`,rotulo:`Direção, Coordenador e DigiSTI`,detalhe:`Direção do Espaço, Coordenador e DigiSTI. O Atendedor não tem acesso a este ecrã.`}}];function b_(e){return y_.find(t=>t.id===e)}function x_({ecraId:e}){let t=mt(),{ap:n,mudarAp:r,repor:i}=Pr(),a=a_(),o=b_(e),s=v_[n.vista],c=r_.filter(e=>e.vista===n.vista),l=n=>{a.sair(),r(e=>void(e.vista=n)),v_[n].ecras.includes(e)||t(`/ecra/${v_[n].ecras[0]}`)};return(0,z.jsxs)(`aside`,{className:`flex h-full w-[360px] shrink-0 flex-col overflow-y-auto border-r-[1.5px] border-tinta bg-papel`,"aria-label":`Navegador do protótipo`,children:[(0,z.jsxs)(`div`,{className:`flex items-center gap-3 px-5 pt-4 pb-3`,children:[(0,z.jsx)(`img`,{src:m_,alt:`Bool`,className:`size-7`}),(0,z.jsxs)(`div`,{className:`leading-tight`,children:[(0,z.jsx)(`div`,{className:`text-[16px] font-semibold`,children:`Portal de Atendimento`}),(0,z.jsx)(`div`,{className:`text-[13px] text-nota`,children:`Protótipo. Os dados são inventados.`})]})]}),(0,z.jsxs)(`section`,{className:`px-4 pb-4`,"aria-labelledby":`rotulo-vista`,children:[(0,z.jsx)(`h2`,{id:`rotulo-vista`,className:`px-1 pb-2 text-[14px] font-semibold`,children:`Ver como`}),(0,z.jsx)(`div`,{role:`radiogroup`,"aria-labelledby":`rotulo-vista`,className:`grid grid-cols-3 gap-2`,children:Object.keys(v_).map(e=>{let t=n.vista===e,r=e===`atendedor`?Qa:e===`digisti`?To:Bo;return(0,z.jsxs)(`button`,{type:`button`,role:`radio`,"aria-checked":t,onClick:()=>l(e),"data-vista":e,className:W(`flex min-h-[92px] flex-col items-center justify-center gap-1.5 rounded-lg border-[1.5px] border-tinta px-1 text-center shadow-[3px_3px_0_rgba(0,0,0,.12)]`,t?`bg-tinta text-white`:`bg-card hover:bg-[#f6f5f1]`),children:[(0,z.jsx)(r,{className:`size-6`,"aria-hidden":`true`}),(0,z.jsx)(`span`,{className:`text-[15px] leading
